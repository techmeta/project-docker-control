# =============================================================================
#  Redis — production configuration
# -----------------------------------------------------------------------------
#  Mounted READ-ONLY at /usr/local/etc/redis/redis.conf. compose appends a few
#  command-line overrides for the values that differ per host (password,
#  maxmemory, policy, appendonly); redis applies command-line arguments AFTER
#  the config file, so those win. Everything else is here, in git, reviewable.
#
#  Read-only also means CONFIG REWRITE fails, deliberately: configuration
#  belongs in this file, not in whatever a redis-cli session left behind.
#
#  THIS INSTANCE IS SHARED between four logical databases:
#      0  queues, sessions, locks      1  general cache      2  products L1
#  Several settings below are load-bearing *because* of that sharing and are
#  marked. Read those notes before changing them.
# =============================================================================

################################## NETWORK ####################################

# 0.0.0.0, and this needs justifying rather than apologising for. The stock
# redis.conf binds 127.0.0.1, which inside a container is the container's own
# loopback — the application, in a different container, cannot reach it, and
# the failure presents as a connection refused that looks like redis is down.
#
# What actually keeps this private is three other things: the port is not
# published to the host by default (see compose.yml), the project network is
# not shared with any other stack, and requirepass is mandatory below.
bind 0.0.0.0
protected-mode yes
port 6379

# Backlog of completed-but-unaccepted connections. 511 is the redis default
# and is capped by the kernel's somaxconn — on a busy host raise both or this
# silently becomes 128.
tcp-backlog 511

# Close idle client connections after 5 minutes. 0 (the redis default) leaks a
# file descriptor per abandoned connection; PHP-FPM and Octane workers that
# die mid-request are exactly how that happens.
timeout 300

# TCP keepalive probes. Detects a peer that vanished without a FIN — a killed
# container, a NAT timeout — instead of holding the connection forever.
tcp-keepalive 300

################################## GENERAL ####################################

# Never daemonize in a container: PID 1 must be redis itself, or it receives
# no signals and every stop is a 30-second wait and a SIGKILL.
daemonize no
supervised no
loglevel notice
# Empty = stdout, which is what `docker compose logs` reads. A logfile path
# here means the logs go into the container's writable layer and vanish.
logfile ""

# 16 is the redis default. This application uses 0, 1 and 2; the rest are
# headroom. Note that logical databases are NOT isolation — SELECT reaches all
# of them on one connection, one FLUSHALL takes all of them, and maxmemory is
# shared across the lot.
databases 16

# Show the ASCII art on start. It carries the version, the PID and the port,
# which is genuinely the fastest way to confirm what came up.
always-show-logo no

################################ SNAPSHOTTING  ################################

# RDB snapshots, kept ALONGSIDE the AOF rather than instead of it. The backup
# script copies an RDB (`redis-cli --rdb`), and a point-in-time file is also
# far faster to load than replaying an AOF after a crash.
#
#   after 900s if >=1 key changed, 300s if >=10, 60s if >=10000
save 900 1
save 300 10
save 60 10000

# Refuse writes when a background save has failed. This reads as harsh and is
# the correct setting: the usual cause is a full disk, and the alternative is
# redis cheerfully accepting writes it cannot persist until the process
# restarts and they are gone. `make health` and the disk guard exist so this
# is caught before it fires.
stop-writes-on-bgsave-error yes

rdbcompression yes
# Costs ~10% on load, detects a truncated or corrupted RDB before it is
# silently loaded as a partial dataset.
rdbchecksum yes
dbfilename dump.rdb
dir /data

############################# APPEND ONLY MODE ###############################

# appendonly is set from the command line (REDIS_APPENDONLY in .env) so the
# restore script can flip it for one boot. It is `yes` everywhere else and
# that is LOAD-BEARING: database 0 holds queued jobs, and the slow lane runs
# --tries=1, so a job lost in a restart is not retried — it is gone, and some
# of those jobs are paid external API calls. RDB alone loses everything since
# the last snapshot.

appendfilename "appendonly.aof"
# Redis 7+ splits the AOF across a manifest and several files in this
# directory. Worth knowing for restores: dropping a bare dump.rdb into /data
# does nothing while this directory still exists — redis prefers the AOF.
# `make restore TARGET=redis` handles that; a manual copy will not.
appenddirname "appendonlydir"

# everysec: fsync once a second. Worst case on a hard crash is one second of
# writes. `always` fsyncs every command — roughly an order of magnitude slower
# and not worth it for a cache and queue; `no` leaves it to the kernel and can
# lose 30 seconds.
appendfsync everysec

# Do not fsync during a BGREWRITEAOF. Prevents the latency spike where the
# rewrite's disk I/O blocks the main thread's fsync.
no-appendfsync-on-rewrite yes

# Rewrite the AOF when it doubles, but never below 64mb — without the floor a
# small dataset rewrites constantly.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load a truncated AOF (the tail of an unclean shutdown) and log it, rather
# than refusing to start. `no` means one unclean power-off leaves redis
# refusing to boot until someone runs redis-check-aof by hand at 3am.
aof-load-truncated yes

# Write an RDB-format preamble at the head of a rewritten AOF: much faster
# loads, same durability.
aof-use-rdb-preamble yes

################################### MEMORY ####################################

# maxmemory and maxmemory-policy are set from .env on the command line.
#
# The POLICY IS LOAD-BEARING and the reason is that this instance is shared.
# volatile-lru evicts only keys carrying a TTL. Queued jobs carry none, so
# eviction can never take queued work; cache entries all carry one, so they
# are always reclaimable. Switch to any allkeys-* policy and a full instance
# starts deleting jobs — silently, with no error anywhere, presenting as work
# that was accepted and never ran.
#
# noeviction is the other defensible choice: it makes a full instance reject
# writes loudly instead. It is not used here because it takes the cache down
# with the queue.

# LRU is approximated by sampling. 5 is the default and close enough to true
# LRU; 10 is noticeably more accurate and slightly more CPU.
maxmemory-samples 5

# Free memory in a background thread rather than blocking the main one. The
# difference is visible whenever a large key is evicted or expires — without
# these, deleting one big hash stalls every other client.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

############################# LAZY FREEING / THREADS ##########################

# Free the memory of a closed connection's buffers in a background thread.
io-threads 1

################################ CLIENT LIMITS ################################

# normal clients: unlimited (killing an application client mid-pipeline is
# worse than the memory). pubsub: 32mb hard, 8mb sustained for 60s — a slow
# subscriber must not be allowed to grow a buffer without bound.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

################################## SLOW LOG ###################################

# Log commands taking over 10ms. On a cache that is already pathological, so
# the log stays short and every entry is worth reading. `make redis-slowlog`.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Track events that took over 100ms end to end, including time spent blocked.
# Read with `redis-cli --latency` / LATENCY DOCTOR.
latency-monitor-threshold 100

############################## EVENT NOTIFICATION ##############################

# Off. Keyspace notifications are a real throughput cost and nothing in this
# application subscribes to them. Laravel's queues do not need them.
notify-keyspace-events ""

############################### ADVANCED CONFIG ###############################

# Small collections are stored as compact encodings until they exceed these
# thresholds. The defaults are well chosen; they are spelled out because the
# products cache stores many small hashes and this is what keeps them cheap.
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size 128
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000

# Rehash the main dictionary incrementally in idle CPU. `no` gives slightly
# better latency at the cost of memory that is never handed back.
activerehashing yes

# Active defragmentation. OFF, because it is a CPU cost that only pays for
# itself on an instance with proven fragmentation — check
# `redis-cli INFO memory | grep ratio` and turn it on if mem_fragmentation_ratio
# sits above ~1.5 with a large dataset.
activedefrag no

# Refuse to start if the configured maxmemory cannot plausibly be honoured.
# (Redis warns; the container limit in compose.yml is the real backstop.)
proto-max-bulk-len 512mb

# ── A note on renaming commands ──────────────────────────────────────────────
# The usual hardening advice is to rename FLUSHALL, FLUSHDB, KEYS and CONFIG.
# It is NOT done here and that is a considered choice: Laravel's redis cache
# store issues FLUSHDB for `cache:clear`, and the queue and cache internals use
# commands that the blanket versions of this advice also rename. Renaming them
# produces an application that fails in ways nobody connects back to this file.
# The protection that actually applies here is that the port is unpublished and
# requirepass is mandatory.
